<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Demo</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 640px;
            margin: 60px auto;
            padding: 0 20px;
        }
        h2 {
            font-size: 22px;
        }
        h3 {
            font-size: 16px;
            margin-top: 28px;
        }
        button {
            padding: 10px 18px;
            cursor: pointer;
            margin-right: 8px;
        }
        #output {
            margin-top: 20px;
            border: 1px solid #ccc;
            padding: 14px;
            min-height: 40px;
            line-height: 1.5;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

    <h2>Exploring the Fetch API</h2>

    <h3>GET request</h3>
    <button id="loadData">Load Post Data</button>

    <h3>POST request</h3>
    <button id="createPost">Create New Post</button>

    <div id="output">Results will appear here.</div>

    <script>
        const output = document.getElementById("output");

        const GET_URL = "https://jsonplaceholder.typicode.com/posts/1";
        const POST_URL = "https://jsonplaceholder.typicode.com/posts";

        // Shows an error in red
        function showError(message) {
            output.innerHTML = '<span class="error">Error: ' + message + "</span>";
        }

        //  GET 
        document.getElementById("loadData").addEventListener("click", function () {
            output.textContent = "Loading...";

            fetch(GET_URL)
                .then(function (response) {
                    // Fetch does NOT reject on 404 or 500, so check ok manually
                    if (!response.ok) {
                        throw new Error("HTTP error! Status: " + response.status);
                    }
                    return response.json();
                })
                .then(function (data) {
                    output.innerHTML =
                        "<strong>Post Title:</strong> " + data.title + "<br><br>" +
                        "<strong>Content:</strong> " + data.body;
                })
                .catch(function (error) {
                    // Handles network failures and the throw above
                    showError(error.message);
                });
        });

        // POST
        document.getElementById("createPost").addEventListener("click", function () {
            output.textContent = "Sending...";

            const newPost = {
                title: "My New Post",
                body: "Learning Fetch API is fun!",
                userId: 1
            };

            fetch(POST_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(newPost)
            })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error("HTTP error! Status: " + response.status);
                    }
                    return response.json();
                })
                .then(function (data) {
                    output.innerHTML =
                        "<strong>New Post Created!</strong><br>" +
                        "Post ID: " + data.id + "<br><br>" +
                        "<strong>Title:</strong> " + data.title + "<br>" +
                        "<strong>Body:</strong> " + data.body + "<br>" +
                        "<strong>User ID:</strong> " + data.userId;
                    console.log("POST response:", data);
                })
                .catch(function (error) {
                    showError(error.message);
                });
        });
    </script>

</body>
</html>
